{% extends 'base.html' %}

{% load static %}

{% block title %}Password Reset{% endblock %}
{% block content %}
    <header>
        <h1>Recipe Book</h1>
    </header>
    {% if validlink %}
        <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change password">
        </form>
    {% else %}
        <p>Invalid password reset link!</p>
    {% endif %}
{% endblock %}
