{% extends 'base.html' %}

{% load static %}

{% block title %}Login{% endblock %}
{% block content %}
    <header>
        <h1>Recipe Book</h1>
    </header>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <a href="{% url 'password_reset' %}">Forgot password?</a>
{% endblock %}
