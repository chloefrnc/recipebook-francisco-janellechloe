{% extends 'base.html' %}

{% load static %}

{% block title %}Recipe Book{% endblock %}
{% block content%}
    <header>
        <h1>Recipe Book</h1>
    </header>
    {% for recipe in recipes %}
        <h3>{{ name }}</h3>
        {%for ingredient in ingredients %}
            <ul>
                <li>{{ name }}, {{ quantity }}</li>
            </ul>
        {% endfor %}
        <p><a href="{{ link }}">Link to recipe</a></p>
    {% endfor %}
{% endblock}
