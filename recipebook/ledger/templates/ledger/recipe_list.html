{% extends 'base.html' %}

{% load static %}

{% block title %}Recipe Book{% endblock %}
{% block content %}
    <header>
        <h1>Recipe Book</h1>
    </header>
    <ul>
        {% for recipe in recipes %}
            <li><a href='{{ recipe.get_absolute_url }}'>{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
